# Kronagent testbed — Docker option (higher-fidelity SQS via ElasticMQ).
#
# The DEFAULT testbed is moto's standalone server (testbed/sqs_emulator.py):
# pip-installable, zero-auth, no Docker, pure Python, and enough to run the live
# ingestion path end-to-end. Use THIS compose file only when you want a
# standalone, language-agnostic SQS endpoint with production-like fidelity —
# e.g. driving the queue from a non-Python producer, or validating SQS semantics
# (long-poll waits, redrive/DLQ, visibility timeouts) more strictly.
#
# Why NOT LocalStack: LocalStack's Community Edition went proprietary and
# auth-token-gated in March 2026. ElasticMQ is Apache-2.0, zero-auth, and
# SQS-native — the right Docker choice for an SQS-only workload like this one.
#
# Usage:
#   docker compose -f testbed/docker-compose.yml up -d
#   export KRONAGENT_SQS_ENDPOINT_URL=http://localhost:9324
#   python3 testbed/sqs_emulator.py enqueue     # create the queue + stream findings
#   # (that prints the queue URL; export it, then in another shell:)
#   export KRONAGENT_SQS_QUEUE_URL=http://localhost:9324/000000000000/kronagent-findings
#   python3 run_slice.py                        # live ingestion
#   docker compose -f testbed/docker-compose.yml down

services:
  sqs:
    image: softwaremill/elasticmq-native:1.6.14
    container_name: kronagent-testbed-sqs
    ports:
      - "9324:9324"   # SQS API
      - "9325:9325"   # web UI (queue inspector)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9325/"]
      interval: 5s
      timeout: 3s
      retries: 5
